name: Generate design.md and llms.txt

on:
  schedule:
    # 매일 00:00 UTC (09:00 KST)
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate docs from facebook/astryx
        run: python3 scripts/generate.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet design.md llms.txt llms-full.txt; then
            echo "No changes — skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add design.md llms.txt llms-full.txt
          git commit -m "chore: regenerate design.md, llms.txt, llms-full.txt from facebook/astryx"
          git push
